# SPDX-License-Identifier: MIT
name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate repository states
        run: python scripts/fork120.py validate --root .
      - name: Prove deterministic Genesis rendering
        run: |
          python scripts/fork120.py render-canon \
            --root . \
            --state canon/states/chapter-zero-r000.json \
            --git-commit 0000000000000000000000000000000000000000 \
            > /tmp/fork120-genesis.txt
          diff -u docs/launch/genesis-preview.txt /tmp/fork120-genesis.txt
